name: FreeBSD
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  pull-requests: write
  issues: read
  packages: none

jobs:
  build_freebsd:
    # NAppGUI 1.7 rejects CMAKE_SYSTEM_NAME=FreeBSD ("Unknown Platform").
    if: false
    runs-on: ubuntu-22.04
    name: FreeBSD (unsupported)

    steps:
      - name: Skip
        run: echo "FreeBSD is unsupported by NAppGUI 1.7; job is disabled."
